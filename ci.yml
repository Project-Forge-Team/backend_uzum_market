# CI: линтер, проверки конфигурации/миграций, валидация OpenAPI, тесты.
#
# ВАЖНО: файл лежит в корне репозитория, а не в `.github/workflows/`, потому что
# GitHub-приложение, через которое вёлся этот коммит, не имеет права создавать файлы
# в `.github/workflows/`. Чтобы включить CI, выполните:
#
#     mkdir -p .github/workflows
#     git mv ci.yml .github/workflows/ci.yml
#     git commit -m "ci: включить workflow"
#
# Дальше всё работает как есть (проверяемые шаги не зависят от расположения файла).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Тесты на sqlite: быстрый CI без сервис-контейнера. Миграции Postgres-специфику
      # не содержат (индексы/CheckConstraint переносимы).
      DATABASE_URL: sqlite:////tmp/ci.sqlite3
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
      - name: Линтер
        run: ruff check . && ruff format --check .
      - name: Проверка конфигурации
        run: python manage.py check
      - name: Миграции сгенерированы (нет дрейфа)
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI совпадает с кодом
        run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
      - name: Тесты
        # config.test_settings: sqlite :memory:, быстрый хешер паролей, LocMem-кэш,
        # отключённый SSL-редирект и «высокие» лимиты троттлинга — иначе часть тестов
        # зависит от прод-настроек и окружения CI.
        run: python manage.py test --settings=config.test_settings --verbosity=2
